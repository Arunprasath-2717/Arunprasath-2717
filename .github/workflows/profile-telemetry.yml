name: AP 2717 / telemetry refresh
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/render_profile.py'
      - '.github/workflows/profile-telemetry.yml'
permissions:
  contents: write
concurrency:
  group: profile-telemetry
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout profile
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - name: Generate from GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/render_profile.py --live
      - name: Test renderer
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Commit generated assets if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/*.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(profile): refresh GitHub telemetry'
          git push origin HEAD:main
