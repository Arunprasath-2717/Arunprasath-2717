name: Refresh profile artwork

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'data/profile.json'
      - '.github/workflows/profile-telemetry.yml'
      - 'README.md'
  pull_request:
    paths:
      - 'scripts/**'
      - 'data/profile.json'
      - '.github/workflows/profile-telemetry.yml'
      - 'README.md'
      - 'assets/**'

permissions:
  contents: read

concurrency:
  group: profile-artwork-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Test SVG renderer and repository layout
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  refresh:
    needs: validate
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - name: Fetch contribution data and render
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build_profile.py --live
      - name: Generate authentic GitHub contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: Arunprasath-2717
          github_token: ${{ github.token }}
          outputs: |
            assets/snake-light.svg?palette=github-light&color_snake=#2da44e
            assets/snake-dark.svg?palette=github-dark&color_snake=#56d364
      - name: Verify generated snake SVGs
        run: |
          python3 -c 'import xml.etree.ElementTree as ET; [ET.parse("assets/snake-"+theme+".svg") for theme in ("light","dark")]'
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Publish changed artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/*.svg data/contributions.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(profile): refresh development record and snake'
          git push origin HEAD:main
