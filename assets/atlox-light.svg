<svg xmlns="http://www.w3.org/2000/svg" width="960" height="210" viewBox="0 0 960 210" role="img" aria-labelledby="title desc"><title id="title">Atlox AI</title><desc id="desc">Group multi-source news into events.. Analyze sentiment, entities and trends.. Conceptual animation, not live service telemetry.</desc><style>.review{animation:review 6s ease-in-out infinite}.scanner{animation:scan 6s ease-in-out infinite}.packet{animation:packet 3.5s linear infinite}.p1{animation-delay:-1.2s}.p2{animation-delay:-2.4s}.packetlight{animation:led 3s ease-in-out infinite}@keyframes review{0%,100%{opacity:.72}25%,55%{opacity:1}}@keyframes scan{0%{transform:translateX(0)}50%{transform:translateX(335px)}100%{transform:translateX(0)}}@keyframes packet{0%{opacity:0;translate:0 0}20%{opacity:1}70%{opacity:1;translate:28px 0}100%{opacity:0;translate:52px 0}}@keyframes led{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0" y="0" width="960" height="210" rx="8" fill="#f6f3e9" /><text x="29" y="32" font-size="12" fill="#92471f" font-weight="700" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" letter-spacing="1.4">02  /  NEWS INTELLIGENCE</text><text x="28" y="79" font-size="41" fill="#252a21" font-weight="750" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" >Atlox AI</text><text x="30" y="108" font-size="15" fill="#555e50" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" >Group multi-source news into events.</text><text x="30" y="130" font-size="15" fill="#555e50" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" >Analyze sentiment, entities and trends.</text><text x="30" y="177" font-size="12" fill="#252a21" font-weight="500" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" >FastAPI / PyTorch / Transformers / Redis</text><rect x="484" y="18" width="450" height="174" rx="5" fill="#e4e8d9" /><text x="502" y="39" font-size="11" fill="#555e50" font-weight="700" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" >STREAM PROCESSING</text><rect x="502" y="58" width="74" height="28" rx="3" fill="#f6f3e9" /><text x="539" y="77" font-size="11" fill="#252a21" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" >RSS</text><path d="M576 72H601L628 108" fill="none" stroke="#c9cebe" stroke-width="2" /><g class="packet p0" transform="translate(576 72)"><circle cx="0" cy="0" r="3.5" fill="#92471f" /></g><rect x="502" y="95" width="74" height="28" rx="3" fill="#f6f3e9" /><text x="539" y="114" font-size="11" fill="#252a21" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" >API</text><path d="M576 109H601L628 108" fill="none" stroke="#c9cebe" stroke-width="2" /><g class="packet p1" transform="translate(576 109)"><circle cx="0" cy="0" r="3.5" fill="#92471f" /></g><rect x="502" y="132" width="74" height="28" rx="3" fill="#f6f3e9" /><text x="539" y="151" font-size="11" fill="#252a21" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" >FEED</text><path d="M576 146H601L628 108" fill="none" stroke="#c9cebe" stroke-width="2" /><g class="packet p2" transform="translate(576 146)"><circle cx="0" cy="0" r="3.5" fill="#92471f" /></g><rect x="628" y="75" width="90" height="66" rx="4" fill="#f6f3e9" /><text x="673" y="103" font-size="17" fill="#92471f" font-weight="750" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" >NLP</text><text x="673" y="123" font-size="11" fill="#555e50" font-weight="400" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" >cluster</text><path d="M718 108L746