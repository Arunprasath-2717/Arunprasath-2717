<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">Atlox event grouping</title><desc id="desc">Four illustrative headlines converge into two event clusters; moving points depict data grouping.</desc><style>@keyframes route{0%{offset-distance:0%;opacity:0}12%,88%{opacity:1}100%{offset-distance:100%;opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.moving{opacity:0}}</style><rect x="0" y="0" width="960" height="350" fill="#f4f7f3" /><text x="32" y="48" font-size="34" fill="#1c2b22" font-family="Georgia, Times New Roman, serif" font-weight="400" text-anchor="start" >Find the event behind the headlines</text><text x="32" y="80" font-size="17" fill="#45584b" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" >Illustrative clustering of related news fragments</text><path d="M32 99H928" fill="none" stroke="#afc1b1" stroke-width="1" /><text x="32" y="126" font-size="18" fill="#45584b" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" >Incoming headlines</text><text x="634" y="126" font-size="18" fill="#45584b" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" >Grouped events</text><text x="32" y="154" font-size="21" fill="#1c2b22" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" >City opens new rail line</text><path d="M340 147C455 147 480 173 616 173" fill="none" stroke="#afc1b1" stroke-width="1.5" /><circle r="4" fill="#286440" class="moving" style="offset-path:path('M340 147C455 147 480 173 616 173');animation:route 3.2s linear infinite;animation-delay:-0.0s" cx="0" cy="0"/><text x="32" y="196" font-size="21" fill="#1c2b22" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" >First trains begin service</text><path d="M340 189C455 189 480 173 616 173" fill="none" stroke="#afc1b1" stroke-width="1.5" /><circle r="4" fill="#286440" class="moving" style="offset-path:path('M340 189C455 189 480 173 616 173');animation:route 3.2s linear infinite;animation-delay:-0.7s" cx="0" cy="0"/><text x="32" y="238" font-size="21" fill="#1c2b22" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" >Rain warning issued</text><path d="M340 231C455 231 480 251 616 251" fill="none" stroke="#afc1b1" stroke-width="1.5" /><circle r="4" fill="#286440" class="moving" style="offset-path:path('M340 231C455 231 480 251 616 251');animation:route 3.2s linear infinite;animation-delay:-1.4s" cx="0" cy="0"/><text x="32" y="280" font-size="21" fill="#1c2b22" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" >Heavy rainfall forecast</text><path d="M340 273C455 273 480 251 616 251" fill="none" stroke="#afc1b1" stroke-width="1.5" /><circle r="4" fill="#286440" class="moving" style="offset-path:path('M340 273C455 273 480 251 616 251');animation:route 3.2s linear infinite;animation-delay:-2.0999999999999996s" cx="0" cy="0"/><path d="M634 143V205" fill="none" stroke="#286440" stroke-width="3" /><text x="650" y="168" font-size="27" fill="#1c2b22" font-family="Arial, Helvetica, sans-serif" font-weight="600" text-anchor="start" >Rail opening</text><text x="650" y="192" font-size="17" fill="#45584b" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" >2 matching reports</text><path d="M634 223V285" fill="none" stroke="#805421" stroke-width="3" /><text x="650" y="248" font-size="27" fill="#1c2b22" font-family="Arial, Helvetica, sans-serif" font-weight="600" text-anchor="start" >Weather warning</text><text x="650" y="272" font-size="17" fill="#45584b" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" >2 matching reports</text><path d="M32 304H928" fill="none" stroke="#afc1b1" stroke-width="1" /><text x="32" y="331" font-size="17" fill="#45584b" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" >Normalize and deduplicate before NLP and density-based clustering.</text></svg>
