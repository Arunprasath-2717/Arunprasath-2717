<svg xmlns="http://www.w3.org/2000/svg" width="960" height="210" viewBox="0 0 960 210" role="img" aria-labelledby="title desc"><title id="title">VerifAI</title><desc id="desc">Separate model claims from evidence.. Keep uncertainty and decisions auditable.. Conceptual animation, not live service telemetry.</desc><style>.review{animation:review 6s ease-in-out infinite}.scanner{animation:scan 6s ease-in-out infinite}.packet{animation:packet 3.5s linear infinite}.p1{animation-delay:-1.2s}.p2{animation-delay:-2.4s}.packetlight{animation:led 3s ease-in-out infinite}@keyframes review{0%,100%{opacity:.72}25%,55%{opacity:1}}@keyframes scan{0%{transform:translateX(0)}50%{transform:translateX(335px)}100%{transform:translateX(0)}}@keyframes packet{0%{opacity:0;translate:0 0}20%{opacity:1}70%{opacity:1;translate:28px 0}100%{opacity:0;translate:52px 0}}@keyframes led{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0" y="0" width="960" height="210" rx="8" fill="#f6f8f6" /><text x="29" y="32" font-size="12" fill="#865b27" font-weight="700" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" letter-spacing="1.4">01  /  AI VERIFICATION</text><text x="28" y="79" font-size="41" fill="#1e2724" font-weight="750" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" >VerifAI</text><text x="30" y="108" font-size="15" fill="#4f6058" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" >Separate model claims from evidence.</text><text x="30" y="130" font-size="15" fill="#4f6058" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" >Keep uncertainty and decisions auditable.</text><text x="30" y="177" font-size="12" fill="#1e2724" font-weight="500" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" >Python / FastAPI / PostgreSQL / Pytest</text><rect x="484" y="18" width="450" height="174" rx="5" fill="#e7ede9" /><text x="502" y="39" font-size="11" fill="#4f6058" font-weight="700" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" >EVIDENCE REVIEW</text><g class="review" style="animation-delay:0.0s"><rect x="502" y="52" width="410" height="35" rx="3" fill="#f6f8f6" /><rect x="502" y="52" width="4" height="35" rx="1" fill="#19743d" /><text x="514" y="66" font-size="12" fill="#1e2724" font-weight="650" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" >Claim 01</text><text x="514" y="79" font-size="10" fill="#4f6058" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" >Evidence found</text><text x="898" y="74" font-size="11" fill="#19743d" font-weight="700" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" >SUPPORT</text></g><g class="review" style="animation-delay:-1.2s"><rect x="502" y="95" width="410" height="35" rx="3" fill="#f6f8f6" /><rect x="502" y="95" width="4" height="35" rx="1" fill="#865b27" /><text x="514" y="109" font-size="12" fill="#1e2724" font-weight="650" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" >Claim 02</text><text x="514" y="122" font-size="10" fill="#4f6058" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" >Source conflict</text><text x="898" y="117" font-size="11" fill="#865b27" font-weight="700" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" >DISPUTE</text></g><g class="review" style="animation-delay:-2.4s"><rect x="502" y="138" width="410" height="35" rx="3" fill="#f6f8f6" /><rect x="502" y="138" width="4" height="35" rx="1" fill="#4f6058" /><text x="514" y="152" font-size="12" fill="#1e2724" font-weight="650" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" >Claim 03</text><text x="514" y="165" font-size="10" fill="#4f6058" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" >Insufficient data</text><text x="898" y="160" font-size="11" fill="#4f6058" font-weight="700" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" >UNKNOWN</text></g><rect x="502" y="183" width="410" height="2" rx="0" fill="#c9d3ce" /><rect x="502" y="183" width="75" height="2" rx="0" fill="#19743d" class="scanner"/></svg>
