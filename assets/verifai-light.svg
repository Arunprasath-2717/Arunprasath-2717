<svg xmlns="http://www.w3.org/2000/svg" width="960" height="326" viewBox="0 0 960 326" role="img" aria-labelledby="title desc"><title id="title">VerifAI evidence review</title><desc id="desc">Illustrative claim about a library disagrees with sample retrieved Sunday opening hours; independent review yields dispute.</desc><style>.scan{animation:scan 5s ease-in-out infinite}@keyframes scan{0%,100%{transform:scaleX(.04);opacity:.25}55%,82%{transform:scaleX(1);opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.moving{opacity:0}}</style><rect x="0" y="0" width="960" height="326" fill="#f4f7f3" /><text x="32" y="48" font-size="34" fill="#1c2b22" font-family="Georgia, Times New Roman, serif" font-weight="400" text-anchor="start" >Evidence before verdict</text><text x="32" y="80" font-size="17" fill="#45584b" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" >Illustrative example from the verification workflow</text><path d="M32 99H928" fill="none" stroke="#afc1b1" stroke-width="1" /><text x="32" y="133" font-size="18" fill="#45584b" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" >Model claim</text><text x="32" y="164" font-size="26" fill="#1c2b22" font-family="Georgia, Times New Roman, serif" font-weight="400" text-anchor="start" >“The library is closed on Sunday.”</text><rect x="32" y="179" width="430" height="2" fill="#afc1b1" /><rect x="32" y="179" width="430" height="2" fill="#286440" class="scan" style="transform-origin:32px 179px"/><text x="32" y="220" font-size="18" fill="#45584b" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" >Retrieved evidence</text><text x="32" y="252" font-size="24" fill="#1c2b22" font-family="Georgia, Times New Roman, serif" font-weight="400" text-anchor="start" >“Sunday hours: 10:00–16:00.”</text><path d="M489 137V256" fill="none" stroke="#afc1b1" stroke-width="1" /><text x="531" y="133" font-size="18" fill="#45584b" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" >Independent review</text><text x="531" y="173" font-size="24" fill="#1c2b22" font-family="Arial, Helvetica, sans-serif" font-weight="600" text-anchor="start" >Claim and source disagree</text><text x="531" y="210" font-size="30" fill="#805421" font-family="Arial, Helvetica, sans-serif" font-weight="600" text-anchor="start" >Verdict: dispute</text><text x="531" y="244" font-size="17" fill="#45584b" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" >No evidence → unknown</text><path d="M32 280H928" fill="none" stroke="#afc1b1" stroke-width="1" /><text x="32" y="307" font-size="17" fill="#45584b" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" >Extract claim  →  retrieve sources  →  review  →  keep evidence</text></svg>
