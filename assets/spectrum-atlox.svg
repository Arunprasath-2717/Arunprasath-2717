<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title desc"><title id="title">Atlox AI</title><desc id="desc">Illustrative grouping of two related railway news reports into one event.</desc><style>.sheet{animation:sheet 5s ease-in-out infinite}.s1{animation-delay:-2s}.join{animation:join 1.5s linear infinite}@keyframes sheet{50%{transform:translate(3px,0)}}@keyframes join{to{stroke-dashoffset:-14}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#27272b"/><stop offset=".62" stop-color="#1b1d21"/><stop offset="1" stop-color="#17191d"/></linearGradient><radialGradient id="wash"><stop stop-color="#a5e7d0" stop-opacity=".20"/><stop offset="1" stop-color="#a5e7d0" stop-opacity="0"/></radialGradient><clipPath id="panel"><rect x="1" y="1" width="958" height="238" rx="15"/></clipPath></defs><rect x="1" y="1" width="958" height="238" rx="15" fill="url(#paper)" stroke="#a5e7d0" stroke-opacity=".28"/><g clip-path="url(#panel)"><ellipse cx="787.1999999999999" cy="57.599999999999994" rx="364.8" ry="192.0" fill="url(#wash)"/></g><text x="27" y="32" font-family="Consolas, Liberation Mono, monospace" font-size="12" fill="#a5e7d0" font-weight="700" text-anchor="start" letter-spacing="1.3">02 / NEWS INTELLIGENCE</text><text x="25" y="79" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#fff5e8" font-weight="700" text-anchor="start" >Atlox AI</text><text x="27" y="112" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#c6c5c2" font-weight="400" text-anchor="start" >Merge related news coverage into events.</text><text x="27" y="136" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#c6c5c2" font-weight="400" text-anchor="start" >Deduplication, NLP and density-based clustering.</text><text x="27" y="214" font-family="Consolas, Liberation Mono, monospace" font-size="12" fill="#a5e7d0" font-weight="600" text-anchor="start" >PYTHON · FASTAPI · REDIS · NLP</text><text x="27" y="177" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#a5e7d0" font-weight="500" text-anchor="start" >Redis processing · local in-memory fallback</text><g class="sheet s0"><rect x="526" y="27" width="199" height="71" fill="#dbe7dc" rx="6" stroke="#afc1b3"/><text x="539" y="47" font-family="Consolas, Liberation Mono, monospace" font-size="10" fill="#52695f" font-weight="700" text-anchor="start" >REPORT A</text><text x="539" y="73" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#253c32" font-weight="700" text-anchor="start" >Rail line opens</text><rect x="539" y="85" width="146" height="3" fill="#82998d" rx="1.5"/></g><g class="sheet s1"><rect x="552" y="103" width="199" height="71" fill="#dbe7dc" rx="6" stroke="#afc1b3"/><text x="565" y="123" font-family="Consolas, Liberation Mono, monospace" font-size="10" fill="#52695f" font-weight="700" text-anchor="start" >REPORT B</text><text x="565" y="149" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#253c32" font-weight="700" text-anchor="start" >First trains run</text><rect x="565" y="161" width="146" height="3" fill="#82998d" rx="1.5"/></g><rect x="766" y="102" width="163" height="81" fill="#253832" rx="7" stroke="#a5e7d0" stroke-opacity=".65"/><text x="778" y="123" font-family="Consolas, Liberation Mono, monospace" font-size="10" fill="#a5e7d0" font-weight="700" text-anchor="start" >EVENT CLUSTER</text><text x="778" y="149" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fff5e8" font-weight="700" text-anchor="start" >Rail opening</text><text x="778" y="168" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#c6c5c2" font-weight="400" text-anchor="start" >2 related reports</text><path d="M725 63Q752 63 765 119M751 139H765" fill="none" stroke="#a5e7d0" stroke-width="1.4" stroke-dasharray="3 4" class="join" opacity=".8"/><text x="932" y="223" font-family="Consolas, Liberation Mono, monospace" font-size="10" fill="#c6c5c2" font-weight="400" text-anchor="end" >ILLUSTRATIVE CLUSTER · NOT LIVE NEWS</text></svg>
