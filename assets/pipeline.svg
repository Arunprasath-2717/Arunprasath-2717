weight="400" text-anchor="start" >ML + evaluation</text><path d="M381 134h10m-4 -4l4 4-4 4" fill="none" stroke="#50f5e5" stroke-linejoin="round" /><rect x="394" y="81" width="165" height="106" rx="7" fill="#101d2d" stroke="#26394a" /><rect x="394" y="81" width="165" height="3" rx="0" fill="#50f5e5" stroke="none" /><text x="406" y="108" fill="#50f5e5" font-size="12" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="700" text-anchor="start" >03</text><text x="406" y="140" fill="#e8f3fa" font-size="17" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="700" text-anchor="start" >REGISTER</text><text x="406" y="163" fill="#98afc6" font-size="12" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="400" text-anchor="start" >Version + track</text><path d="M562 134h10m-4 -4l4 4-4 4" fill="none" stroke="#50f5e5" stroke-linejoin="round" /><rect x="575" y="81" width="165" height="106" rx="7" fill="#101d2d" stroke="#26394a" /><rect x="575" y="81" width="165" height="3" rx="0" fill="#fa72c9" stroke="none" /><text x="587" y="108" fill="#50f5e5" font-size="12" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="700" text-anchor="start" >04</text><text x="587" y="140" fill="#e8f3fa" font-size="17" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="700" text-anchor="start" >SERVE</text><text x="587" y="163" fill="#98afc6" font-size="12" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="400" text-anchor="start" >API + container</text><path d="M743 134h10m-4 -4l4 4-4 4" fill="none" stroke="#50f5e5" stroke-linejoin="round" /><rect x="756" y="81" width="165" height="106" rx="7" fill="#101d2d" stroke="#26394a" /><rect x="756" y="81" width="165" height="3" rx="0" fill="#50f5e5" stroke="none" /><text x="768" y="108" fill="#50f5e5" font-size="12" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="700" text-anchor="start" >05</text><text x="768" y="140" fill="#e8f3fa" font-size="17" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="700" text-anchor="start" >OBSERVE</text><text x="768" y="163" fill="#98afc6" font-size="12" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="400" text-anchor="start" >Metrics + feedback</text><path d="M839 188V217H113V190M109 195L113 190L117 195" fill="none" stroke="#fa72c9" stroke-linejoin="round" stroke-dasharray="5 5" stroke-width="1.5"/><rect x="346" y="206" width="268" height="22" rx="0" fill="#080e19" stroke="none" /><text x="480" y="221" fill="#fa72c9" font-size="12" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="700" text-anchor="middle" >CONTINUOUS IMPROVEMENT</text><text x="33" y="261" fill="#f9cd78" font-size="12" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="700" text-anchor="start" >OPERATING PRINCIPLES</text><text x="33" y="289" fill="#e8f3fa" font-size="17" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="600" text-anchor="start" >Reproducibility   /   Automation   /   Observability   /   Reliability</text></svg>
