<svg xmlns="http://www.w3.org/2000/svg" width="960" height="432" viewBox="0 0 960 432" role="img" aria-labelledby="title desc"><title id="title">MLOps learning roadmap</title><desc id="desc">Ingest, train, evaluate, serve, observe, improve. Feedback returns to the next experiment. Conceptual learning map.</desc><style>@keyframes journey{0%{offset-distance:0%;opacity:0}7%,93%{opacity:1}100%{offset-distance:100%;opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.moving{opacity:0}}</style><rect x="0" y="0" width="960" height="432" fill="#f4f7f3" /><text x="32" y="48" font-size="34" fill="#1c2b22" font-family="Georgia, Times New Roman, serif" font-weight="400" text-anchor="start" >The model lifecycle</text><text x="32" y="80" font-size="17" fill="#45584b" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" >Learning roadmap, from input data to measured feedback</text><path d="M96 175H350Q480 175 480 244T610 329H864" fill="none" stroke="#afc1b1" stroke-width="10" stroke-linecap="round"/><path d="M96 175H350Q480 175 480 244T610 329H864" fill="none" stroke="#286440" stroke-width="2" stroke-linecap="round"/><path d="M864 329Q916 329 916 280V147Q916 105 882 105H600" fill="none" stroke="#afc1b1" stroke-width="1.5" stroke-dasharray="5 7"/><circle cx="96" cy="175" r="9" fill="#f4f7f3" stroke="#286440" stroke-width="2"/><text x="96" y="145" font-size="20" fill="#1c2b22" font-family="Arial, Helvetica, sans-serif" font-weight="600" text-anchor="middle" >Ingest</text><text x="96" y="126" font-size="15" fill="#45584b" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="middle" >Data checks</text><circle cx="275" cy="175" r="9" fill="#f4f7f3" stroke="#286440" stroke-width="2"/><text x="275" y="145" font-size="20" fill="#1c2b22" font-family="Arial, Helvetica, sans-serif" font-weight="600" text-anchor="middle" >Train</text><text x="275" y="126" font-size="15" fill="#45584b" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="middle" >Version model</text><circle cx="468" cy="218" r="9" fill="#f4f7f3" stroke="#286440" stroke-width="2"/><text x="568" y="208" font-size="20" fill="#1c2b22" font-family="Arial, Helvetica, sans-serif" font-weight="600" text-anchor="middle" >Evaluate</text><text x="568" y="230" font-size="15" fill="#45584b" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="middle" >Quality gates</text><circle cx="610" cy="329" r="9" fill="#f4f7f3" stroke="#286440" stroke-width="2"/><text x="610" y="290" font-size="20" fill="#1c2b22" font-family="Arial, Helvetica, sans-serif" font-weight="600" text-anchor="middle" >Serve</text><text x="610" y="271" font-size="15" fill="#45584b" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="middle" >API / container</text><circle cx="746" cy="329" r="9" fill="#f4f7f3" stroke="#286440" stroke-width="2"/><text x="746" y="368" font-size="20" fill="#1c2b22" font-family="Arial, Helvetica, sans-serif" font-weight="600" text-anchor="middle" >Observe</text><text x="746" y="390" font-size="15" fill="#45584b" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="middle" >Logs / metrics</text><circle cx="864" cy="329" r="9" fill="#f4f7f3" stroke="#286440" stroke-width="2"/><text x="864" y="290" font-size="20" fill="#1c2b22" font-family="Arial, Helvetica, sans-serif" font-weight="600" text-anchor="middle" >Improve</text><text x="864" y="271" font-size="15" fill="#45584b" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="middle" >Feedback</text><circle r="5" cx="0" cy="0" fill="#805421" class="moving" style="offset-path:path('M96 175H350Q480 175 480 244T610 329H864');animation:journey 9s linear infinite"/><text x="896" y="94" font-size="16" fill="#45584b" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="end" >Feedback to the next experiment</text><text x="32" y="413" font-size="17" fill="#45584b" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" >Evaluation and monitoring feed the next experiment.</text></svg>
