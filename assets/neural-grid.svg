<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">AP/2717 neural compute fabric</title><desc id="desc">Isometric server nodes encode weekly GitHub contributions; height maps to contribution count. No synthetic activity.</desc><defs><linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101e30"/><stop offset=".48" stop-color="#080e19"/><stop offset="1" stop-color="#181026"/></linearGradient><linearGradient id="beam"><stop stop-color="#50f5e5" stop-opacity="0"/><stop offset=".5" stop-color="#50f5e5"/><stop offset="1" stop-color="#fa72c9" stop-opacity="0"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#5d9aaa" stroke-opacity=".08"/></pattern><radialGradient id="core"><stop stop-color="#50f5e5" stop-opacity=".25"/><stop offset="1" stop-color="#50f5e5" stop-opacity="0"/></radialGradient></defs><style>.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 28s linear infinite}.pulse{animation:pulse 3.8s ease-in-out infinite}.scan{animation:scan 7s linear infinite}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.28}}@keyframes scan{0%{opacity:0;transform:translateY(0)}15%{opacity:.5}85%{opacity:.5}100%{opacity:0;transform:translateY(115px)}}@media(prefers-reduced-motion:reduce){.orbit,.pulse,.scan{animation:none}}</style><rect x="0" y="0" width="960" height="600" rx="0" fill="#080e19" stroke="none" /><path d="M1 1H937L959 23V599H23L1 577Z" fill="url(#surface)" stroke="#26394a" stroke-linejoin="round" /><rect x="2" y="2" width="956" height="596" rx="0" fill="url(#grid)" stroke="none" /><path d="M2 36V2H82 M878 598H958V564" fill="none" stroke="#50f5e5" stroke-linejoin="round" stroke-width="2"/><style>
.flow{animation:transit 2.4s linear infinite}
.beacon{animation:beacon 3.2s ease-in-out infinite}
@keyframes transit{to{stroke-dashoffset:-48}}
@keyframes beacon{50%{opacity:.28}}
@media(prefers-reduced-motion:reduce){.flow,.beacon{animation:none!important}}
</style><text x="32" y="34" fill="#50f5e5" font-size="15" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="700" text-anchor="start" >00</text><text x="86" y="35" fill="#e8f3fa" font-size="23" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="750" text-anchor="start" >NEURAL GRID / AP-2717</text><text x="928" y="34" fill="#98afc6" font-size="12" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="400" text-anchor="end" >GENERATIVE CONTRIBUTION FABRIC</text><path d="M32 49L928 49" fill="none" stroke="#26394a" stroke-width="1" /><text x="34" y="81" fill="#50f5e5" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="700" text-anchor="start" >ONE WEEK. ONE COMPUTE NODE.</text><text x="34" y="104" fill="#98afc6" font-size="13" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="400" text-anchor="start" >A digital twin of my GitHub contribution rhythm.</text><text x="926" y="81" fill="#f9cd78" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="700" text-anchor="end" >AWAITING CALENDAR</text><text x="926" y="104" fill="#98afc6" font-size="12" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="400" text-anchor="end" >NO SYNTHETIC COUNTS</text><path d="M482 229.4L885.2 389L530 529.6L126.8 370Z" fill="#0a1726" stroke="#39576a" stroke-linejoin="round" stroke-width="2"/><path d="M482 237L146 370" fill="none" stroke="#1f3546" stroke-linejoin="round" /><path d="M530 256L194 389" fill="none" stroke="#1f3546" stroke-linejoin="round" /><path d="M578 275L242 408" fill="none" stroke="#1f3546" stroke-linejoin="round" /><path d="M626 294L290 427" fill="none" stroke="#1f3546" stroke-linejoin="round" /><path d="M674 313L338 446" fill="none" stroke="#1f3546" stroke-linejoin="round" /><path d="M722 332L386 465" fill="none" stroke="#1f3546" stroke-linejoin="round" /><path d="M770 351L434 484" fill="none" stroke="#1f3546" stroke-linejoin="round" /><path d="M818 370L482 503" fill="none" stroke="#1f3546" stroke-linejoin="round" /><path d="M866 389L530 522" fill="none" stroke="#1f3546" stroke-linejoin="round" /><path d="M482 237L866 389" fill="none" stroke="#1f3546" stroke-linejoin="round" /><path d="M434 256L818 408" fill="none" stroke="#1f3546" stroke-linejoin="round" /><path d="M386 275L770 427" fill="none" stroke="#1f3546" stroke-linejoin="round" /><path d="M338 294L722 446" fill="none" stroke="#1f3546" stroke-linejoin="round" /><path d="M290 313L674 465" fill="none" stroke="#1f3546" stroke-linejoin="round" /><path d="M242 332L626 484" fill="none" stroke="#1f3546" stroke-linejoin="round" /><path d="M194 351L578 503" fill="none" stroke="#1f3546" stroke-linejoin="round" /><path d="M146 370L530 522" fill="none" stroke="#1f3546" stroke-linejoin="round" /><path d="M388.4 275.95L767.6 426.05" fill="none" stroke="#294b60" stroke-linejoin="round" stroke-width="2"/><path d="M388.4 275.95L767.6 426.05" fill="none" stroke="#fa72c9" stroke-linejoin="round" stroke-width="2" stroke-dasharray="5 19" class="flow" style="animation-delay:0s"/><path d="M671.6 313.95L340.4 445.05" fill="none" stroke="#294b60" stroke-linejoin="round" stroke-width="2"/><path d="M671.6 313.95L340.4 445.05" fill="none" stroke="#50f5e5" stroke-linejoin="round" stroke-width="2" stroke-dasharray="5 19" class="flow" style="animation-delay:-1s"/><path d="M244.4 332.95L623.6 483.05" fill="none" stroke="#294b60" stroke-linejoin="round" stroke-width="2"/><path d="M244.4 332.95L623.6 483.05" fill="none" stroke="#f9cd78" stroke-linejoin="round" stroke-width="2" stroke-dasharray="5 19" class="flow" style="animation-delay:-0.7s"/><text x="482" y="315" fill="#f9cd78" font-size="17" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="700" text-anchor="middle" >CALENDAR DATA NOT AVAILABLE</text><text x="482" y="342" fill="#98afc6" font-size="13" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="400" text-anchor="middle" >The grid populates after a successful GitHub refresh.</text><text x="34" y="153" fill="#50f5e5" font-size="12" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="700" text-anchor="start" >01 / GRID</text><text x="34" y="173" fill="#98afc6" font-size="12" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="400" text-anchor="start" >8 nodes per row</text><text x="926" y="431" fill="#fa72c9" font-size="12" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="700" text-anchor="end" >02 / SCALE</text><text x="926" y="451" fill="#98afc6" font-size="12" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="400" text-anchor="end" >Weekly counts</text><path d="M32 520L928 520" fill="none" stroke="#26394a" stroke-width="1" /><rect x="34" y="540" width="11" height="11" rx="2" fill="#476273" stroke="none" /><text x="53" y="550" fill="#98afc6" font-size="12" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="400" text-anchor="start" >Zero activity</text><rect x="224" y="540" width="11" height="11" rx="2" fill="#50f5e5" stroke="none" /><text x="243" y="550" fill="#98afc6" font-size="12" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="400" text-anchor="start" >Active week</text><rect x="414" y="540" width="11" height="11" rx="2" fill="#fa72c9" stroke="none" /><text x="433" y="550" fill="#98afc6" font-size="12" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="400" text-anchor="start" >High activity</text><rect x="624" y="540" width="11" height="11" rx="2" fill="#f9cd78" stroke="none" /><text x="643" y="550" fill="#98afc6" font-size="12" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="400" text-anchor="start" >Peak week</text><text x="34" y="580" fill="#98afc6" font-size="12" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="400" text-anchor="start" >Height = normalized weekly contributions (square-root scale). Animated routes are conceptual.</text></svg>
