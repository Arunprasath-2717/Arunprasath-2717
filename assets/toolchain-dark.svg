<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc"><title id="title">Source to serving</title><desc id="desc">Illustrative Linux to ML serving delivery sequence. The moving artifact follows five stages.</desc><style>.artifact{animation:artifact 8s linear infinite}@keyframes artifact{0%{transform:translateX(0);opacity:0}5%,95%{opacity:1}100%{transform:translateX(780px);opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.moving{opacity:0}}</style><rect x="0" y="0" width="960" height="260" fill="#171c19" /><text x="32" y="48" font-size="34" fill="#edf1e9" font-family="Georgia, Times New Roman, serif" font-weight="400" text-anchor="start" >From source to serving</text><text x="32" y="80" font-size="17" fill="#bbc6bd" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" >A software delivery sequence I work with and study</text><path d="M90 158H870" fill="none" stroke="#46574b" stroke-width="3" /><circle cx="90" cy="158" r="10" fill="#171c19" stroke="#b5d5ac" stroke-width="2"/><text x="90" y="127" font-size="22" fill="#edf1e9" font-family="Arial, Helvetica, sans-serif" font-weight="600" text-anchor="middle" >Linux</text><text x="90" y="199" font-size="19" fill="#bbc6bd" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="middle" >Source</text><circle cx="285" cy="158" r="10" fill="#171c19" stroke="#b5d5ac" stroke-width="2"/><text x="285" y="127" font-size="22" fill="#edf1e9" font-family="Arial, Helvetica, sans-serif" font-weight="600" text-anchor="middle" >Git / CI</text><text x="285" y="199" font-size="19" fill="#bbc6bd" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="middle" >Tests</text><circle cx="480" cy="158" r="10" fill="#171c19" stroke="#b5d5ac" stroke-width="2"/><text x="480" y="127" font-size="22" fill="#edf1e9" font-family="Arial, Helvetica, sans-serif" font-weight="600" text-anchor="middle" >Docker</text><text x="480" y="199" font-size="19" fill="#bbc6bd" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="middle" >Image</text><circle cx="675" cy="158" r="10" fill="#171c19" stroke="#b5d5ac" stroke-width="2"/><text x="675" y="127" font-size="22" fill="#edf1e9" font-family="Arial, Helvetica, sans-serif" font-weight="600" text-anchor="middle" >Cloud</text><text x="675" y="199" font-size="19" fill="#bbc6bd" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="middle" >Deploy</text><circle cx="870" cy="158" r="10" fill="#171c19" stroke="#b5d5ac" stroke-width="2"/><text x="870" y="127" font-size="22" fill="#edf1e9" font-family="Arial, Helvetica, sans-serif" font-weight="600" text-anchor="middle" >MLOps</text><text x="870" y="199" font-size="19" fill="#bbc6bd" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="middle" >Serve</text><g class="artifact moving"><rect x="78" y="145" width="24" height="26" fill="#b5d5ac" /><path d="M84 154H96M84 159H96M84 164H92" fill="none" stroke="#171c19" stroke-width="1.5" /></g><text x="480" y="239" font-size="17" fill="#bbc6bd" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="middle" >Build and test an artifact before promoting it to the next stage.</text></svg>
