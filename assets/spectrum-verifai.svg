<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title desc"><title id="title">VerifAI</title><desc id="desc">AI verification, example claim conflicts with Sunday opening hours. Evidence is highlighted; not a real evaluation result.</desc><style>.mark{animation:mark 5s ease-in-out infinite}.verdict{animation:verdict 5s ease-in-out infinite}@keyframes mark{0%,15%,100%{opacity:.25}40%,75%{opacity:1}}@keyframes verdict{0%,35%,100%{opacity:.58}55%,85%{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#27272b"/><stop offset=".62" stop-color="#1b1d21"/><stop offset="1" stop-color="#17191d"/></linearGradient><radialGradient id="wash"><stop stop-color="#ff987d" stop-opacity=".20"/><stop offset="1" stop-color="#ff987d" stop-opacity="0"/></radialGradient><clipPath id="panel"><rect x="1" y="1" width="958" height="238" rx="15"/></clipPath></defs><rect x="1" y="1" width="958" height="238" rx="15" fill="url(#paper)" stroke="#ff987d" stroke-opacity=".28"/><g clip-path="url(#panel)"><ellipse cx="787.1999999999999" cy="57.599999999999994" rx="364.8" ry="192.0" fill="url(#wash)"/></g><text x="27" y="32" font-family="Consolas, Liberation Mono, monospace" font-size="12" fill="#ff987d" font-weight="700" text-anchor="start" letter-spacing="1.3">01 / EVIDENCE &amp; RETRIEVAL</text><text x="25" y="79" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#fff5e8" font-weight="700" text-anchor="start" >VerifAI</text><text x="27" y="112" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#c6c5c2" font-weight="400" text-anchor="start" >Compare AI answers against checkable sources.</text><text x="27" y="136" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#c6c5c2" font-weight="400" text-anchor="start" >Keep uncertainty when evidence is insufficient.</text><text x="27" y="214" font-family="Consolas, Liberation Mono, monospace" font-size="12" fill="#ff987d" font-weight="600" text-anchor="start" >PYTHON · FASTAPI · POSTGRESQL · BM25</text><text x="27" y="177" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ff987d" font-weight="500" text-anchor="start" >Independent review · local BM25 fallback</text><rect x="522" y="22" width="410" height="184" fill="#f4e8d8" rx="10"/><text x="538" y="44" font-family="Consolas, Liberation Mono, monospace" font-size="10" fill="#775749" font-weight="700" text-anchor="start" >EVIDENCE REVIEW / EXAMPLE</text><text x="538" y="67" font-family="Consolas, Liberation Mono, monospace" font-size="10" fill="#765b50" font-weight="700" text-anchor="start" >CLAIM</text><text x="538" y="88" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#362d29" font-weight="700" text-anchor="start" >“Library closed Sunday.”</text><path d="M538 99H916" fill="none" stroke="#cdb5a1" stroke-width="1" /><text x="538" y="119" font-family="Consolas, Liberation Mono, monospace" font-size="10" fill="#765b50" font-weight="700" text-anchor="start" >RETRIEVED SOURCE</text><rect x="537" y="126" width="202" height="25" fill="#ffd08b" rx="3" opacity=".7" class="mark"/><text x="538" y="145" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#362d29" font-weight="600" text-anchor="start" >Sunday: 10:00–16:00</text><path d="M538 155H916" fill="none" stroke="#cdb5a1" stroke-width="1" /><text x="538" y="180" font-family="Consolas, Liberation Mono, monospace" font-size="10" fill="#765b50" font-weight="700" text-anchor="start" >VERDICT</text><text x="916" y="182" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#9c4233" font-weight="750" text-anchor="end" class="verdict">Dispute</text><circle cx="902" cy="44" r="4" fill="#b35340" class="mark"/><text x="932" y="223" font-family="Consolas, Liberation Mono, monospace" font-size="10" fill="#c6c5c2" font-weight="400" text-anchor="end" >ILLUSTRATIVE CASE · NOT LIVE TRAFFIC</text></svg>
