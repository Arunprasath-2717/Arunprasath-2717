<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-labelledby="title desc"><title id="title">CadastraVision</title><desc id="desc">GEOSPATIAL SYSTEMS. Parcel validation, spatial records, tamper-evident audits and exports. Diagram is conceptual.</desc><defs><linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101e30"/><stop offset=".48" stop-color="#080e19"/><stop offset="1" stop-color="#181026"/></linearGradient><linearGradient id="beam"><stop stop-color="#50f5e5" stop-opacity="0"/><stop offset=".5" stop-color="#50f5e5"/><stop offset="1" stop-color="#fa72c9" stop-opacity="0"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#5d9aaa" stroke-opacity=".08"/></pattern><radialGradient id="core"><stop stop-color="#50f5e5" stop-opacity=".25"/><stop offset="1" stop-color="#50f5e5" stop-opacity="0"/></radialGradient></defs><style>.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 28s linear infinite}.pulse{animation:pulse 3.8s ease-in-out infinite}.scan{animation:scan 7s linear infinite}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.28}}@keyframes scan{0%{opacity:0;transform:translateY(0)}15%{opacity:.5}85%{opacity:.5}100%{opacity:0;transform:translateY(115px)}}@media(prefers-reduced-motion:reduce){.orbit,.pulse,.scan{animation:none}}</style><rect x="0" y="0" width="960" height="250" rx="0" fill="#080e19" stroke="none" /><path d="M1 1H937L959 23V249H23L1 227Z" fill="url(#surface)" stroke="#26394a" stroke-linejoin="round" /><rect x="2" y="2" width="956" height="246" rx="0" fill="url(#grid)" stroke="none" /><path d="M2 36V2H82 M878 248H958V214" fill="none" stroke="#50f5e5" stroke-linejoin="round" stroke-width="2"/><style>
.flow{animation:transit 2.4s linear infinite}
.beacon{animation:beacon 3.2s ease-in-out infinite}
@keyframes transit{to{stroke-dashoffset:-48}}
@keyframes beacon{50%{opacity:.28}}
@media(prefers-reduced-motion:reduce){.flow,.beacon{animation:none!important}}
</style><text x="32" y="32" fill="#50f5e5" font-size="12" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="700" text-anchor="start" >AP / 2717   //   SYSTEM 04</text><text x="32" y="74" fill="#e8f3fa" font-size="34" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="750" text-anchor="start" >CadastraVision</text><text x="34" y="106" fill="#50f5e5" font-size="15" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="700" text-anchor="start" >GEOSPATIAL SYSTEMS</text><text x="34" y="142" fill="#98afc6" font-size="15" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="400" text-anchor="start" >Parcel validation, spatial records,</text><text x="34" y="165" fill="#98afc6" font-size="15" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="400" text-anchor="start" >tamper-evident audits and exports.</text><text x="34" y="228" fill="#e8f3fa" font-size="12" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="600" text-anchor="start" >FASTAPI  /  POSTGIS  /  REACT</text><text x="928" y="228" fill="#50f5e5" font-size="12" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="700" text-anchor="end" >REPOSITORY  ↗</text><path d="M510 31L510 205" fill="none" stroke="#26394a" stroke-width="1" /><path d="M664 106H699" fill="none" stroke="#294b60" stroke-linejoin="round" stroke-width="2"/><path d="M664 106H699" fill="none" stroke="#50f5e5" stroke-linejoin="round" stroke-width="2" stroke-dasharray="5 19" class="flow" style="animation-delay:0s"/><path d="M805 106H824V64H835" fill="none" stroke="#294b60" stroke-linejoin="round" stroke-width="2"/><path d="M805 106H824V64H835" fill="none" stroke="#fa72c9" stroke-linejoin="round" stroke-width="2" stroke-dasharray="5 19" class="flow" style="animation