<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 178" width="960" height="178" role="img" aria-labelledby="t d"><title id="t">VerifAI</title><desc id="d">Separate model claims from evidence.. Keep uncertainty and decisions auditable.. Independent checks, explicit unknowns.</desc><style>.signal{animation:signal 3s linear infinite}@keyframes signal{to{stroke-dashoffset:-30}}@media(prefers-reduced-motion:reduce){.signal{animation:none}}</style><rect x="0" y="0" width="960" height="178" rx="10" fill="#141613" stroke="none"/><rect x="22" y="20" width="4" height="135" rx="2" fill="#ef9a67" stroke="none"/><text x="40" y="36" font-size="12" fill="#ef9a67" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="700" text-anchor="start" >01  /  AI VERIFICATION</text><text x="40" y="73" font-size="33" fill="#f0eee4" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="730" text-anchor="start" >VerifAI</text><text x="40" y="99" font-size="15" fill="#a8afa0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="400" text-anchor="start" >Separate model claims from evidence.</text><text x="40" y="120" font-size="15" fill="#a8afa0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="400" text-anchor="start" >Keep uncertainty and decisions auditable.</text><text x="40" y="149" font-size="12" fill="#f0eee4" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="500" text-anchor="start" >Python / FastAPI / PostgreSQL / Pytest</text><rect x="475" y="22" width="462" height="136" rx="6" fill="#20231e" stroke="none"/><text x="491" y="43" font-size="11" fill="#a8afa0" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="650" text-anchor="start" letter-spacing="1">SYSTEM FLOW</text><path d="M585 82L610 82" fill="none" stroke="#ef9a67" stroke-width="2" /><path d="M710 82L746 82" fill="none" stroke="#ef9a67" stroke-width="2" /><path d="M660 111L660 102" fill="none" stroke="#b8d68d" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M710 123L788 123" fill="none" stroke="#b8d68d" stroke-width="1.5" /><path d="M788 123L788 102" fill="none" stroke="#b8d68d" stroke-width="1.5" /><path d="M830 82L852 82" fill="none" stroke="#b8d68d" stroke-width="2" /><rect x="489" y="62" width="96" height="40" rx="4" fill="#141613" stroke="#41483b"/><text x="537.0" y="87.0" font-size="12" fill="#f0eee4" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="650" text-anchor="middle" >AI answer</text><rect x="610" y="62" width="100" height="40" rx="4" fill="#141613" stroke="#41483b"/><text x="660.0" y="87.0" font-size="12" fill="#f0eee4" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="650" text-anchor="middle" >Claims</text><rect x="746" y="62" width="84" height="40" rx="4" fill="#141613" stroke="#41483b"/><text x="788.0" y="87.0" font-size="12" fill="#ef9a67" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="650" text-anchor="middle" >Judges</text><rect x="852" y="62" width="69" height="40" rx="4" fill="#141613" stroke="#41483b"/><text x="886.5" y="87.0" font-size="12" fill="#b8d68d" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="650" text-anchor="middle" >Verdict</text><rect x="610" y="111" width="100" height="24" rx="4" fill="#141613" stroke="#41483b"/><text x="660.0" y="128.0" font-size="12" fill="#b8d68d" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="650" text-anchor="middle" >Evidence</text><text x="921" y="142" font-size="11" fill="#a8afa0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="400" text-anchor="end" >Unknown is a valid result</text><path d="M489 151L921 151" fill="none" stroke="#41483b" stroke-width="1" /><path d="M489 151L921 151" fill="none" stroke="#b8d68d" stroke-width="1.5" stroke-dasharray="3 27" class="signal"/></svg>
