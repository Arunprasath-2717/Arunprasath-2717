<svg xmlns="http://www.w3.org/2000/svg" width="960" height="210" viewBox="0 0 960 210" role="img" aria-labelledby="title desc"><title id="title">CANE</title><desc id="desc">Route incoming messages by context.. Explain every notify, digest or mute decision.. Conceptual animation, not live service telemetry.</desc><style>.review{animation:review 6s ease-in-out infinite}.scanner{animation:scan 6s ease-in-out infinite}.packet{animation:packet 3.5s linear infinite}.p1{animation-delay:-1.2s}.p2{animation-delay:-2.4s}.packetlight{animation:led 3s ease-in-out infinite}@keyframes review{0%,100%{opacity:.72}25%,55%{opacity:1}}@keyframes scan{0%{transform:translateX(0)}50%{transform:translateX(335px)}100%{transform:translateX(0)}}@keyframes packet{0%{opacity:0;translate:0 0}20%{opacity:1}70%{opacity:1;translate:28px 0}100%{opacity:0;translate:52px 0}}@keyframes led{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0" y="0" width="960" height="210" rx="8" fill="#171b20" /><text x="29" y="32" font-size="12" fill="#e3c491" font-weight="700" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" letter-spacing="1.4">03  /  CONTEXT-AWARE ROUTING</text><text x="28" y="79" font-size="41" fill="#f0f3f1" font-weight="750" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" >CANE</text><text x="30" y="108" font-size="15" fill="#b1b9ba" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" >Route incoming messages by context.</text><text x="30" y="130" font-size="15" fill="#b1b9ba" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" >Explain every notify, digest or mute decision.</text><text x="30" y="177" font-size="12" fill="#f0f3f1" font-weight="500" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" >Python / TF-IDF / RapidFuzz / Rules</text><rect x="484" y="18" width="450" height="174" rx="5" fill="#242c30" /><text x="502" y="39" font-size="11" fill="#b1b9ba" font-weight="700" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" >CONTEXT-AWARE ROUTER</text><rect x="502" y="54" width="108" height="118" rx="4" fill="#171b20" /><text x="515" y="73" font-size="10" fill="#b1b9ba" font-weight="700" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" >INBOX</text><rect x="511" y="82" width="90" height="23" rx="3" fill="#242c30" /><text x="517" y="97" font-size="10" fill="#f0f3f1" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" >Urgent</text><rect x="511" y="109" width="90" height="23" rx="3" fill="#242c30" /><text x="517" y="124" font-size="10" fill="#f0f3f1" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" >Routine</text><rect x="511" y="136" width="90" height="23" rx="3" fill="#242c30" /><text x="517" y="151" font-size="10" fill="#f0f3f1" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" >Untrusted</text><rect x="635" y="87" width="92" height="52" rx="5" fill="#171b20" /><text x="681" y="109" font-size="12" fill="#e3c491" font-weight="750" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" >CONTEXT</text><text x="681" y="125" font-size="10" fill="#b1b9ba" font-weight="400" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" >score + rules</text><path d="M610 113H635" fill="none" stroke="#3d484b" stroke-width="3" /><path d="M727 113H751" fill="none" stroke="#3d484b" stroke-width="3" /><path d="M751 113V74H769" fill="none" stroke="#3d484b" stroke-width="2" /><rect x="769" y="59" width="145" height="31" rx="4" fill="#171b20" /><rect x="769" y="59" width="5" height="31" rx="2" fill="#70db94" /><text x="783" y="79" font-size="12" fill="#70db94" font-weight="750" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" >NOTIFY</text><circle cx="900" cy="74" r="3.7" fill="#70db94" class="packetlight" style="animation-delay:0.0s"/><path d="M751 113V116H769" fill="none" stroke="#3d484b" stroke-width="2" /><rect x="769" y="101" width="145" height="31" rx="4" fill="#171b20" /><rect x="769" y="101" width="5" height="31" rx="2" fill="#e3c491" /><text x="783" y="121" font-size="12" fill="#e3c491" font-weight="750" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" >DIGEST</text><circle cx="900" cy="116" r="3.7" fill="#e3c491" class="packetlight" style="animation-delay:-1.1s"/><path d="M751 113V158H769" fill="none" stroke="#3d484b" stroke-width="2" /><rect x="769" y="143" width="145" height="31" rx="4" fill="#171b20" /><rect x="769" y="143" width="5" height="31" rx="2" fill="#b1b9ba" /><text x="783" y="163" font-size="12" fill="#b1b9ba" font-weight="750" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" >MUTE</text><circle cx="900" cy="158" r="3.7" fill="#b1b9ba" class="packetlight" style="animation-delay:-2.2s"/><text x="502" y="184" font-size="10" fill="#b1b9ba" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif" >Example routing · same inputs, same outputs</text></svg>
