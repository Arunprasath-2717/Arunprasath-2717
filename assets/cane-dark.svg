<svg xmlns="http://www.w3.org/2000/svg" width="960" height="378" viewBox="0 0 960 378" role="img" aria-labelledby="title desc"><title id="title">CANE routing ledger</title><desc id="desc">Illustrative messages and deterministic routing outcomes; urgent work notifies, routine update digests, low relevance mutes.</desc><style>.marker{animation:mark 4.8s ease-in-out infinite}@keyframes mark{0%,100%{transform:scaleX(.03);opacity:.1}33%,60%{transform:scaleX(1);opacity:.8}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.moving{opacity:0}}</style><rect x="0" y="0" width="960" height="378" fill="#171c19" /><text x="32" y="48" font-size="34" fill="#edf1e9" font-family="Georgia, Times New Roman, serif" font-weight="400" text-anchor="start" >One message, one explainable decision</text><text x="32" y="80" font-size="17" fill="#bbc6bd" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" >Illustrative messages and routing outcomes</text><path d="M32 99H928" fill="none" stroke="#46574b" stroke-width="1" /><text x="32" y="130" font-size="17" fill="#bbc6bd" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" >Incoming message</text><text x="394" y="130" font-size="17" fill="#bbc6bd" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" >Context</text><text x="735" y="130" font-size="17" fill="#bbc6bd" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" >Action</text><path d="M32 195H928" fill="none" stroke="#46574b" stroke-width="1" /><text x="32" y="171" font-size="23" fill="#edf1e9" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" >“Build failed”</text><text x="394" y="171" font-size="20" fill="#edf1e9" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" >Urgent work item</text><text x="735" y="171" font-size="24" fill="#b5d5ac" font-family="Arial, Helvetica, sans-serif" font-weight="600" text-anchor="start" >Notify</text><rect x="32" y="186" width="7" height="3" fill="#b5d5ac" /><rect x="40" y="186" width="160" height="3" fill="#b5d5ac" class="marker" style="animation-delay:-0.0s;transform-origin:40px 186px"/><path d="M32 259H928" fill="none" stroke="#46574b" stroke-width="1" /><text x="32" y="235" font-size="23" fill="#edf1e9" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" >“Weekly summary”</text><text x="394" y="235" font-size="20" fill="#edf1e9" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" >Routine update</text><text x="735" y="235" font-size="24" fill="#d7b477" font-family="Arial, Helvetica, sans-serif" font-weight="600" text-anchor="start" >Digest</text><rect x="32" y="250" width="7" height="3" fill="#d7b477" /><rect x="40" y="250" width="160" height="3" fill="#d7b477" class="marker" style="animation-delay:-1.6s;transform-origin:40px 250px"/><path d="M32 323H928" fill="none" stroke="#46574b" stroke-width="1" /><text x="32" y="299" font-size="23" fill="#edf1e9" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" >“Unsolicited offer”</text><text x="394" y="299" font-size="20" fill="#edf1e9" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" >Low relevance</text><text x="735" y="299" font-size="24" fill="#bbc6bd" font-family="Arial, Helvetica, sans-serif" font-weight="600" text-anchor="start" >Mute</text><rect x="32" y="314" width="7" height="3" fill="#bbc6bd" /><rect x="40" y="314" width="160" height="3" fill="#bbc6bd" class="marker" style="animation-delay:-3.2s;transform-origin:40px 314px"/><text x="32" y="358" font-size="17" fill="#bbc6bd" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" >Context + historical retrieval + deterministic scoring</text></svg>
