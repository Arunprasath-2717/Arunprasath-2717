<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310" role="img" aria-labelledby="title desc"><title id="title">Request lifecycle</title><desc id="desc">A request goes through an API boundary to a model service and returns a response. This is a conceptual architecture.</desc><style>.request{animation:request 7s linear infinite}.response{animation:response 7s linear infinite}@keyframes request{0%{transform:translateX(0);opacity:0}5%{opacity:1}43%{transform:translateX(874px);opacity:1}49%,100%{opacity:0;transform:translateX(874px)}}@keyframes response{0%,49%{opacity:0;transform:translateX(0)}53%{opacity:1}95%{opacity:1;transform:translateX(-874px)}100%{opacity:0;transform:translateX(-874px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.moving{opacity:0}}</style><rect x="0" y="0" width="960" height="310" fill="#171c19" /><text x="32" y="48" font-size="34" fill="#edf1e9" font-family="Georgia, Times New Roman, serif" font-weight="400" text-anchor="start" >The path of a request</text><text x="32" y="80" font-size="17" fill="#bbc6bd" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" >Conceptual backend and model-serving boundary</text><text x="32" y="137" font-size="22" fill="#edf1e9" font-family="Arial, Helvetica, sans-serif" font-weight="600" text-anchor="start" >Client</text><text x="351" y="137" font-size="22" fill="#edf1e9" font-family="Arial, Helvetica, sans-serif" font-weight="600" text-anchor="start" >API boundary</text><text x="725" y="137" font-size="22" fill="#edf1e9" font-family="Arial, Helvetica, sans-serif" font-weight="600" text-anchor="start" >Model service</text><path d="M32 164H928" fill="none" stroke="#46574b" stroke-width="2" /><path d="M928 214H32" fill="none" stroke="#46574b" stroke-width="2" /><text x="32" y="198" font-size="17" fill="#bbc6bd" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" >Request</text><text x="928" y="250" font-size="17" fill="#bbc6bd" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="end" >Response + trace</text><rect x="344" y="153" width="3" height="72" fill="#b5d5ac" /><rect x="712" y="153" width="3" height="72" fill="#b5d5ac" /><g class="request moving"><rect x="32" y="157" width="22" height="14" fill="#b5d5ac" /><path d="M37 161H49M37 166H45" fill="none" stroke="#171c19" stroke-width="1" /></g><g class="response moving"><rect x="906" y="207" width="22" height="14" fill="#d7b477" /><path d="M911 211H923M911 216H919" fill="none" stroke="#171c19" stroke-width="1" /></g><text x="32" y="286" font-size="18" fill="#bbc6bd" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start" >Validate → persist or retrieve → infer → return a traceable result</text></svg>
