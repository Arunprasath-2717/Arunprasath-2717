<svg xmlns="http://www.w3.org/2000/svg" width="960" height="536" viewBox="0 0 960 536" role="img" aria-labelledby="title desc"><title id="title">Selected projects</title><desc id="desc">VOILORACLE, VerifAI, NexusCloud-Orchestra, CadastraVision, Projexa and Portfolio. Repository and deployment links are below.</desc><defs><linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101e30"/><stop offset=".48" stop-color="#080e19"/><stop offset="1" stop-color="#181026"/></linearGradient><linearGradient id="beam"><stop stop-color="#50f5e5" stop-opacity="0"/><stop offset=".5" stop-color="#50f5e5"/><stop offset="1" stop-color="#fa72c9" stop-opacity="0"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#5d9aaa" stroke-opacity=".08"/></pattern><radialGradient id="core"><stop stop-color="#50f5e5" stop-opacity=".25"/><stop offset="1" stop-color="#50f5e5" stop-opacity="0"/></radialGradient></defs><style>.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 28s linear infinite}.pulse{animation:pulse 3.8s ease-in-out infinite}.scan{animation:scan 7s linear infinite}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.28}}@keyframes scan{0%{opacity:0;transform:translateY(0)}15%{opacity:.5}85%{opacity:.5}100%{opacity:0;transform:translateY(115px)}}@media(prefers-reduced-motion:reduce){.orbit,.pulse,.scan{animation:none}}</style><rect x="0" y="0" width="960" height="536" rx="0" fill="#080e19" stroke="none" /><path d="M1 1H937L959 23V535H23L1 513Z" fill="url(#surface)" stroke="#26394a" stroke-linejoin="round" /><rect x="2" y="2" width="956" height="532" rx="0" fill="url(#grid)" stroke="none" /><path d="M2 36V2H82 M878 534H958V500" fill="none" stroke="#50f5e5" stroke-linejoin="round" stroke-width="2"/><text x="32" y="34" fill="#50f5e5" font-size="15" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="700" text-anchor="start" >03</text><text x="86" y="35" fill="#e8f3fa" font-size="23" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="750" text-anchor="start" >PROJECT TRANSMISSIONS</text><text x="928" y="34" fill="#98afc6" font-size="12" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="400" text-anchor="end" >SELECTED PUBLIC WORK</text><path d="M32 49L928 49" fill="none" stroke="#26394a" stroke-width="1" /><rect x="32" y="67" width="896" height="66" rx="5" fill="#0e1929" stroke="#26394a" /><rect x="32" y="67" width="4" height="66" rx="0" fill="#50f5e5" stroke="none" /><text x="49" y="90" fill="#50f5e5" font-size="13" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="700" text-anchor="start" >01</text><text x="84" y="94" fill="#e8f3fa" font-size="23" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="700" text-anchor="start" >VOILORACLE</text><text x="85" y="117" fill="#98afc6" font-size="15" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="400" text-anchor="start" >Multi-source news, sentiment and event intelligence.</text><text x="914" y="93" fill="#50f5e5" font-size="12" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="700" text-anchor="end" >AI / NEWS INTELLIGENCE</text><path d="M899 109h15v15m0 -15l-15 15" fill="none" stroke="#50f5e5" stroke-linejoin="round" stroke-width="1.5"/><rect x="32" y="143" width="896" height="66" rx="5" fill="#0e1929" stroke="#26394a" /><rect x="32" y="143" width="4" height="66" rx="0" fill="#fa72c9" stroke="none" /><text x="49" y="166" fill="#fa72c9" font-size="13" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="700" text-anchor="start" >02</text><text x="84" y="170" fill="#e8f3fa" font-size="23" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="700" text-anchor="start" >VerifAI</text><text x="85" y="193" fill="#98afc6" font-size="15" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="400" text-anchor="start" >Multi-model answers, claim-level evidence and audit trails.</text><text x="914" y="169" fill="#fa72c9" font-size="12" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="700" text-anchor="end" >AI / VERIFICATION</text><path d="M899 185h15v15m0 -15l-15 15" fill="none" stroke="#fa72c9" stroke-linejoin="round" stroke-width="1.5"/><rect x="32" y="219" width="896" height="66" rx="5" fill="#0e1929" stroke="#26394a" /><rect x="32" y="219" width="4" height="66" rx="0" fill="#f9cd78" stroke="none" /><text x="49" y="242" fill="#f9cd78" font-size="13" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="700" text-anchor="start" >03</text><text x="84" y="246" fill="#e8f3fa" font-size="23" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="700" text-anchor="start" >NexusCloud-Orchestra</text><text x="85" y="269" fill="#98afc6" font-size="15" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="400" text-anchor="start" >Unified multi-cloud storage routing and API layer.</text><text x="914" y="245" fill="#f9cd78" font-size="12" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="700" text-anchor="end" >CLOUD / ORCHESTRATION</text><path d="M899 261h15v15m0 -15l-15 15" fill="none" stroke="#f9cd78" stroke-linejoin="round" stroke-width="1.5"/><rect x="32" y="295" width="896" height="66" rx="5" fill="#0e1929" stroke="#26394a" /><rect x="32" y="295" width="4" height="66" rx="0" fill="#50f5e5" stroke="none" /><text x="49" y="318" fill="#50f5e5" font-size="13" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="700" text-anchor="start" >04</text><text x="84" y="322" fill="#e8f3fa" font-size="23" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="700" text-anchor="start" >CadastraVision</text><text x="85" y="345" fill="#98afc6" font-size="15" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="400" text-anchor="start" >Parcel validation, PostGIS records and tamper-evident audits.</text><text x="914" y="321" fill="#50f5e5" font-size="12" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="700" text-anchor="end" >BACKEND / GEOSPATIAL</text><path d="M899 337h15v15m0 -15l-15 15" fill="none" stroke="#50f5e5" stroke-linejoin="round" stroke-width="1.5"/><rect x="32" y="371" width="896" height="66" rx="5" fill="#0e1929" stroke="#26394a" /><rect x="32" y="371" width="4" height="66" rx="0" fill="#fa72c9" stroke="none" /><text x="49" y="394" fill="#fa72c9" font-size="13" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="700" text-anchor="start" >05</text><text x="84" y="398" fill="#e8f3fa" font-size="23" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="700" text-anchor="start" >Projexa</text><text x="85" y="421" fill="#98afc6" font-size="15" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="400" text-anchor="start" >Academic project submission, tracking and evaluation.</text><text x="914" y="397" fill="#fa72c9" font-size="12" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="700" text-anchor="end" >WEB / WORKFLOW</text><path d="M899 413h15v15m0 -15l-15 15" fill="none" stroke="#fa72c9" stroke-linejoin="round" stroke-width="1.5"/><rect x="32" y="447" width="896" height="66" rx="5" fill="#0e1929" stroke="#26394a" /><rect x="32" y="447" width="4" height="66" rx="0" fill="#f9cd78" stroke="none" /><text x="49" y="470" fill="#f9cd78" font-size="13" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="700" text-anchor="start" >06</text><text x="84" y="474" fill="#e8f3fa" font-size="23" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="700" text-anchor="start" >Portfolio</text><text x="85" y="497" fill="#98afc6" font-size="15" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="400" text-anchor="start" >Personal site, engineering work and technical interests.</text><text x="914" y="473" fill="#f9cd78" font-size="12" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="700" text-anchor="end" >TYPESCRIPT / WEBSITE</text><path d="M899 489h15v15m0 -15l-15 15" fill="none" stroke="#f9cd78" stroke-linejoin="round" stroke-width="1.5"/></svg>
