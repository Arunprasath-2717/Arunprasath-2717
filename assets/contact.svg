<svg xmlns="http://www.w3.org/2000/svg" width="960" height="181" viewBox="0 0 960 181" role="img" aria-labelledby="title desc"><title id="title">Connect with Arun Prasath</title><desc id="desc">Open to software engineering opportunities, AI and MLOps projects, cloud and open-source collaboration.</desc><defs><linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101e30"/><stop offset=".48" stop-color="#080e19"/><stop offset="1" stop-color="#181026"/></linearGradient><linearGradient id="beam"><stop stop-color="#50f5e5" stop-opacity="0"/><stop offset=".5" stop-color="#50f5e5"/><stop offset="1" stop-color="#fa72c9" stop-opacity="0"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#5d9aaa" stroke-opacity=".08"/></pattern><radialGradient id="core"><stop stop-color="#50f5e5" stop-opacity=".25"/><stop offset="1" stop-color="#50f5e5" stop-opacity="0"/></radialGradient></defs><style>.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 28s linear infinite}.pulse{animation:pulse 3.8s ease-in-out infinite}.scan{animation:scan 7s linear infinite}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.28}}@keyframes scan{0%{opacity:0;transform:translateY(0)}15%{opacity:.5}85%{opacity:.5}100%{opacity:0;transform:translateY(115px)}}@media(prefers-reduced-motion:reduce){.orbit,.pulse,.scan{animation:none}}</style><rect x="0" y="0" width="960" height="181" rx="0" fill="#080e19" stroke="none" /><path d="M1 1H937L959 23V180H23L1 158Z" fill="url(#surface)" stroke="#26394a" stroke-linejoin="round" /><rect x="2" y="2" width="956" height="177" rx="0" fill="url(#grid)" stroke="none" /><path d="M2 36V2H82 M878 179H958V145" fill="none" stroke="#50f5e5" stroke-linejoin="round" stroke-width="2"/><text x="32" y="34" fill="#50f5e5" font-size="15" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="700" text-anchor="start" >05</text><text x="86" y="35" fill="#e8f3fa" font-size="23" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="750" text-anchor="start" >OPEN A CHANNEL</text><text x="928" y="34" fill="#98afc6" font-size="12" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-weight="400" text-anchor="end" >COLLABORATION / OPPORTUNITIES</text><path d="M32 49L928 49" fill="none" stroke="#26394a" stroke-width="1" /><text x="32" y="87" fill="#e8f3fa" font-size="25" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="750" text-anchor="start" >Engineer the pipeline. Automate the process.</text><text x="32" y="122" fill="#50f5e5" font-size="25" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="750" text-anchor="start" >Make the system reliable.</text><text x="32" y="155" fill="#98afc6" font-size="16" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="400" text-anchor="start" >Open to software engineering, AI/MLOps, cloud and open-source collaboration.</text></svg>
